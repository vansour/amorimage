[package]
name = "amorimage"
version = "0.0.1"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["multipart"] }
blake3 = "1.8.7"
image = "0.25.10"
mime_guess = "2.0.5"
rust-embed = "8.14.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.1", default-features = false, features = ["macros", "runtime-tokio", "sqlite"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["fs", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
webp = "0.3.1"
